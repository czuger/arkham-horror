{% extends "base.html" %}
{% block title %}Journal — Horreur à Arkham{% endblock %}
{% block content %}
<h1>Journal de la partie {{ id }}</h1>
<p>
  <a href="/partie/{{ id }}">Retour à la partie</a>
  {% if can_undo %}
  <form method="post" action="/partie/{{ id }}/annuler" class="inline">
    <button type="submit" class="small">Annuler le dernier coup</button>
  </form>
  {% endif %}
</p>
<ol class="journal full">
  {% for line in lines %}{% let class = "old" %}{% include "journal/line.html" %}{% endfor %}
</ol>
{% endblock %}
