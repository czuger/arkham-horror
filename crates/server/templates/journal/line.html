<li class="{{ class }}">{% if !line.text.is_empty() %}<span class="line-text">{{ line.text }}</span>{% endif %}
  {% for roll in line.rolls %}<span class="roll" title="{{ roll.who }} : {{ roll.summary }}">{% for die in roll.dice %}<span class="die{% if die.successes > 0 %} success{% endif %}{% if die.successes > 1 %} double{% endif %}" title="{{ die.face }}{% if die.successes > 1 %} : 2 succès{% else if die.successes > 0 %} : succès{% endif %}">{{ die.glyph() }}</span>{% endfor %}<span class="roll-count">{{ roll.summary }}</span></span>{% endfor %}
  {% if !line.cards.is_empty() %}<span class="drawn">{% for drawn in line.cards %}<figure class="drawn-card tip" tabindex="0"><figcaption>{{ drawn.action }} <strong>{{ drawn.who }}</strong></figcaption>{% if drawn.token.image.is_empty() %}<span class="card-name">{{ drawn.token.name }}</span>{% else %}<a href="/assets/{{ drawn.token.image }}" target="_blank"><img src="/assets/{{ drawn.token.image }}" alt="{{ drawn.token.name }}" loading="lazy"></a>{% endif %}{{ drawn.token.tip|safe }}</figure>{% endfor %}</span>{% endif %}
</li>
